<div class="container">
  <h1>Task Manager</h1>

  <div class="task-form">
    <h2>Add New Task</h2>
    <div class="form-group">
      <label for="title">Title</label>
      <input
        type="text"
        id="title"
        [value]="newTask.title"
        (input)="newTask.title = $any($event.target).value"
        placeholder="Enter task title"
        (keyup.enter)="createTask()"
      />
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        [value]="newTask.description || ''"
        (input)="newTask.description = $any($event.target).value"
        placeholder="Enter task description (optional)"
      ></textarea>
    </div>
    <button class="btn btn-primary" (click)="createTask()">Add Task</button>
  </div>

  <div class="task-list" *ngIf="tasks.length > 0; else emptyState">
    <div
      *ngFor="let task of tasks"
      class="task-item"
      [class.completed]="task.completed"
    >
      <ng-container *ngIf="editingTask?.id !== task.id; else editMode">
        <div class="task-header">
          <h3 class="task-title">{{ task.title }}</h3>
        </div>
        <p class="task-description" *ngIf="task.description">
          {{ task.description }}
        </p>
        <div class="task-footer">
          <span class="task-date">{{ formatDate(task.created_at) }}</span>
          <div class="task-actions">
            <button
              class="btn btn-success"
              (click)="toggleComplete(task)"
            >
              {{ task.completed ? 'Undo' : 'Complete' }}
            </button>
            <button class="btn btn-warning" (click)="startEdit(task)">
              Edit
            </button>
            <button class="btn btn-danger" (click)="deleteTask(task)">
              Delete
            </button>
          </div>
        </div>
      </ng-container>

      <ng-template #editMode>
        <div class="form-group">
          <label>Title</label>
          <input
            type="text"
            [value]="editingTask!.title"
            (input)="updateEditingTitle($any($event.target).value)"
            (keyup.enter)="saveEdit()"
          />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea
            [value]="editingTask!.description || ''"
            (input)="updateEditingDescription($any($event.target).value)"
          ></textarea>
        </div>
        <div class="task-actions">
          <button class="btn btn-success" (click)="saveEdit()">Save</button>
          <button class="btn btn-danger" (click)="cancelEdit()">Cancel</button>
        </div>
      </ng-template>
    </div>
  </div>

  <ng-template #emptyState>
    <div class="empty-state">
      <h2>No tasks yet. Create your first task above!</h2>
    </div>
  </ng-template>
</div>
