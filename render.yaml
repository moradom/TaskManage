services:
  # Backend API
  - type: web
    name: taskmanager-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskmanager-db
          property: connectionString
    healthCheckPath: /

  # Frontend
  - type: web
    name: taskmanager-frontend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend

databases:
  - name: taskmanager-db
    databaseName: taskmanager
    user: taskuser
    plan: free
    region: oregon
    postgresMajorVersion: 17
